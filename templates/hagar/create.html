{% extends 'layout.html' %}

{% block content %}
<div class="page page-narrow">
    <div class="page-header" style="justify-content: center; text-align: center;">
        <div>
            <h1>Créer un nouveau Hagar</h1>
            <p class="page-sub">Configurez votre projet et définissez les champs dont vous avez besoin.</p>
        </div>
    </div>

    <form method="POST" id="hagar-form" class="panel">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem;">
            <div class="form-group">
                <label for="hagar-name">Nom du Hagar</label>
                <input type="text" id="hagar-name" name="name" required placeholder="Ex: Boutique Alpha">
            </div>
            <div class="form-group">
                <label for="hagar-password">Mot de passe du Hagar (optionnel)</label>
                <input type="password" id="hagar-password" name="password" placeholder="Protéger l'accès aux données">
            </div>
        </div>

        <div class="panel-divider">
            <div class="form-section-head">
                <h3>Structure des utilisateurs</h3>
                <button type="button" class="btn-add-field btn-add-field-compact" onclick="addField()">+ Ajouter un champ</button>
            </div>

            <p class="notice notice-info">
                <strong>Conseil :</strong> Le premier champ de la liste servira d'identifiant unique (ex: Email, Pseudo, ID).
            </p>

            <div id="fields-container">
                <div class="field-row">
                    <div class="field-grid">
                        <div>
                            <label class="field-label" for="field_label_0">Nom du champ (Label)</label>
                            <input type="text" id="field_label_0" name="field_label[]" placeholder="Ex: Email" required>
                        </div>
                        <div>
                            <label class="field-label" for="field_type_0">Type de donnée</label>
                            <select id="field_type_0" name="field_type[]">
                                <option value="text">Texte classique</option>
                                <option value="password">Mot de passe</option>
                                <option value="email">Email</option>
                                <option value="number">Nombre</option>
                                <option value="date">Date</option>
                                <option value="time">Heure</option>
                                <option value="url">Lien / URL</option>
                                <option value="tel">Téléphone</option>
                                <option value="color">Couleur</option>
                                <option value="checkbox">Case à cocher</option>
                                <option value="range">Curseur (Range)</option>
                                <option value="datetime-local">Date et Heure</option>
                                <option value="month">Mois</option>
                                <option value="week">Semaine</option>
                                <option value="search">Recherche</option>
                                <option value="file">Fichier</option>
                                <option value="hidden">Champ Caché</option>
                                <option value="image">Image (Bouton)</option>
                                <option value="radio">Bouton Radio</option>
                                <option value="button">Bouton Simple</option>
                                <option value="reset">Réinitialiser</option>
                                <option value="submit">Soumettre</option>
                            </select>
                        </div>
                    </div>
                    <button type="button" class="field-remove" onclick="this.closest('.field-row').remove()" aria-label="Supprimer le champ">&times;</button>
                </div>
            </div>
        </div>

        <div style="margin-top: 2.5rem; text-align: center;">
            <button type="submit" class="btn btn-primary" style="padding: 0.9rem 2.5rem; font-size: 1rem;">
                Lancer mon Hagar
            </button>
        </div>
    </form>
</div>

<script>
// Liste des types de champ figée (même valeur que le select initial)
const FIELD_TYPES = [
    ['text', 'Texte classique'], ['password', 'Mot de passe'], ['email', 'Email'],
    ['number', 'Nombre'], ['date', 'Date'], ['time', 'Heure'], ['url', 'Lien / URL'],
    ['tel', 'Téléphone'], ['color', 'Couleur'], ['checkbox', 'Case à cocher'],
    ['range', 'Curseur (Range)'], ['datetime-local', 'Date et Heure'], ['month', 'Mois'],
    ['week', 'Semaine'], ['search', 'Recherche'], ['file', 'Fichier'],
    ['hidden', 'Champ Caché'], ['image', 'Image (Bouton)'], ['radio', 'Bouton Radio'],
    ['button', 'Bouton Simple'], ['reset', 'Réinitialiser'], ['submit', 'Soumettre']
];

// Ajoute dynamiquement une ligne de champ au formulaire (aucun emoji, SVG/HTML simple)
function addField() {
    const container = document.getElementById('fields-container');
    const index = container.querySelectorAll('.field-row').length;
    const newRow = document.createElement('div');
    newRow.className = 'field-row';
    newRow.style.animation = 'rise 0.3s ease-out';
    const options = FIELD_TYPES.map(([v, t]) => `<option value="${v}">${t}</option>`).join('');
    newRow.innerHTML = `
        <div class="field-grid">
            <div>
                <label class="field-label" for="field_label_${index}">Nom du champ (Label)</label>
                <input type="text" id="field_label_${index}" name="field_label[]" placeholder="Nom du champ" required>
            </div>
            <div>
                <label class="field-label" for="field_type_${index}">Type de donnée</label>
                <select id="field_type_${index}" name="field_type[]">${options}</select>
            </div>
        </div>
        <button type="button" class="field-remove" aria-label="Supprimer le champ">&times;</button>
    `;
    newRow.querySelector('.field-remove').addEventListener('click', () => newRow.remove());
    container.appendChild(newRow);
}
</script>
{% endblock %}
