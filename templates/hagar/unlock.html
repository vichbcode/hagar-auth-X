{% extends 'layout.html' %}

{% block content %}
<div style="display: flex; align-items: center; justify-content: center; min-height: 70vh; padding: 1.5rem;">
    <div class="auth-container" style="max-width: 450px; padding: 3rem 2.5rem;">
        <div class="icon-box" style="margin: 0 auto 1.5rem; color: var(--error); border-color: rgba(248, 113, 113, 0.45);">
            <svg class="icon icon-lg" viewBox="0 0 24 24" aria-hidden="true">
                <rect x="4" y="11" width="16" height="9" rx="2"></rect>
                <path d="M8 11V7a4 4 0 0 1 8 0v4"></path>
                <circle cx="12" cy="15.5" r="1.25"></circle>
            </svg>
        </div>

        <h2 style="text-align: center;">Accès protégé</h2>
        <p class="auth-sub">
            Le Hagar <strong>"{{ project.name }}"</strong> est sécurisé.<br>Entrez le mot de passe pour continuer.
        </p>

        <form method="POST">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div class="form-group" style="margin-bottom: 1.75rem;">
                <label for="project_password">Mot de passe du projet</label>
                <input type="password" id="project_password" name="project_password" required autofocus placeholder="••••••••"
                       style="letter-spacing: 2px; font-size: 1.05rem;">
            </div>

            <button type="submit" class="btn-primary btn-full" style="font-size: 1.02rem;">
                Déverrouiller le Hagar
            </button>
        </form>

        <div style="text-align: center; margin-top: 2rem; border-top: 1px solid var(--border); padding-top: 1.5rem;">
            <a href="{{ url_for('dashboard') }}" class="back-link">← Retour au Dashboard</a>
        </div>
    </div>
</div>
{% endblock %}
