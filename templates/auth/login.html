{% extends 'layout.html' %}

{% block content %}
<div class="auth-wrap">
    <div class="auth-container">
        {# Icône trait fin : cadenas, aucun emoji #}
        <div class="icon-box" style="margin: 0 auto 1.1rem;">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
                <rect x="4" y="11" width="16" height="9" rx="2"></rect>
                <path d="M8 11V7a4 4 0 0 1 8 0v4"></path>
            </svg>
        </div>
        <h2>Connexion</h2>
        <p class="auth-sub">Accédez à votre espace Hagar-Auth</p>
        <form method="POST">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div class="form-group">
                <label for="username">Pseudo</label>
                <input type="text" id="username" name="username" required autofocus autocomplete="username">
            </div>
            <div class="form-group">
                <label for="password">Mot de passe</label>
                <input type="password" id="password" name="password" required autocomplete="current-password">
            </div>
            <button type="submit" class="btn-primary btn-full">Se connecter</button>
        </form>
        <p class="auth-alt">
            Pas encore de compte ? <a href="{{ url_for('register') }}">S'inscrire</a>
        </p>
    </div>
</div>
{% endblock %}
